services:
  - type: web
    name: web-vulnerability-scanner
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "5000"
      - key: DATABASE_PATH
        value: "/data/scanner.db"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: scanner-data
      mountPath: /data
      sizeGB: 1
